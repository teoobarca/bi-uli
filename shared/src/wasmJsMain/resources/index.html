<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <!-- cover: the app draws edge to edge and #app keeps out of the notch and the home indicator -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ULI: zápočtový test z BI-ULI</title>
  <meta name="description" content="Precvič si 70 otázok na zápočtový test BI-ULI (Úvod do Linuxu) na FIT ČVUT. V prehliadači aj na iPhone, zadarmo.">
  <meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#13120F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ULI">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:title" content="ULI: zápočtový test z BI-ULI">
  <meta property="og:description" content="70 otázok s vysvetleniami a skúška nanečisto. V prehliadači, aj na iPhone.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { --bg: #FBF7F0; --around: #F1EADD; --ink: #1E1C17; --ink2: #4F4739; --line: #E4DCCB; --accent: #1E1C17; --on: #FFF8EC; }
    @media (prefers-color-scheme: dark) { :root { --bg: #13120F; --around: #0B0A08; --ink: #ECE3D5; --ink2: #CFC5B4; --line: #35322B; --accent: #FFC24D; --on: #261900; } }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); -webkit-text-size-adjust: 100%; }
    body { position: fixed; inset: 0; }
    #app { position: absolute; inset: 0; height: 100dvh; box-sizing: border-box; background: var(--bg);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #splash { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center; background: var(--bg); font: 16px/1.4 -apple-system, system-ui, sans-serif; color: var(--ink2); transition: opacity .18s ease-out; }
    #splash img { width: 88px; height: 88px; border-radius: 22px; }
    #splash h1 { margin: 4px 0 0; font-size: 22px; font-weight: 700; color: var(--ink); }
    #splash .bar { width: 200px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    #splash .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: #FFC24D; transition: width .25s linear; }
    #splash p { margin: 0; max-width: 300px; min-height: 2.8em; font-size: 14px; }
    #splash button { display: none; font: inherit; font-weight: 600; color: var(--on); background: var(--accent); border: 0; border-radius: 22px; padding: 11px 26px; }
    #splash.failed .bar { display: none; }
    #splash.failed button, #splash.slow button { display: block; }
    #splash.gone { opacity: 0; }
    #bar { position: fixed; z-index: 2; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px;
      max-width: 456px; margin: 0 auto; box-sizing: border-box; padding: 10px 10px 10px 16px; border-radius: 16px; background: #33302A; color: #F7EFE3;
      font: 15px/1.3 -apple-system, system-ui, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
    #bar span { flex: 1; }
    #bar button { font: inherit; font-weight: 600; color: #261900; background: #FFC24D; border: 0; border-radius: 12px; padding: 9px 14px; }
    #bar button.x { color: #F7EFE3; background: none; padding: 9px 8px; }
    /* a window wider than a phone: the app is a column in the middle */
    @media (min-width: 521px) {
      html, body { background: var(--around); }
      #app { left: calc(50% - 240px); right: auto; width: 480px; box-shadow: 0 0 0 1px var(--line); }
    }
  </style>
  <script src="web.js"></script>
  <script src="uli.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <div id="splash" role="status">
    <img src="icon-192.png" alt="">
    <h1>ULI</h1>
    <div class="bar"><i></i></div>
    <p>Načítava sa…</p>
    <button type="button">Skúsiť znova</button>
  </div>
  <noscript>ULI potrebuje zapnutý JavaScript.</noscript>
</body>
</html>
